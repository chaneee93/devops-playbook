# SQS 워커 Deployment — 큐에서 메시지를 꺼내서 처리
# KEDA가 이 Deployment를 스케일
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-worker                   # [CHANGE]
  namespace: student16                 # [CHANGE]
spec:
  replicas: 0                          # KEDA가 관리 (초기 0)
  selector:
    matchLabels:
      app: notes-worker
  template:
    metadata:
      labels:
        app: notes-worker
    spec:
      serviceAccountName: keda-worker-sa  # [CHANGE] IRSA SA
      containers:
        - name: worker
          image: amazon/aws-cli:latest    # [CHANGE] 실제 워커 이미지
          command: ["/bin/sh", "-c", "echo 'Worker started'; sleep infinity"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
