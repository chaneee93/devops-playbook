# dev overlay — 최소 스펙
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notes-dev                 # [CHANGE]
namePrefix: dev-
resources:
  - ../../base
replicas:
  - name: notes-app
    count: 1
images:
  - name: IMAGE_PLACEHOLDER
    newName: <ECR_주소>/notes-app     # [CHANGE]
    newTag: v1.0-dev
