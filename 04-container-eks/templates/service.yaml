# ============================================================
# Service — Pod 앞단의 로드밸런서
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: notes-app                    # [CHANGE]
  namespace: student16               # [CHANGE]
spec:
  selector:
    app: notes-app                   # [CHANGE] Deployment의 label과 일치
  ports:
    - port: 80                       # Service가 받는 포트
      targetPort: 8080               # [CHANGE] Pod에 전달하는 포트
  type: ClusterIP                    # 클러스터 내부 통신용
  # type: LoadBalancer               # 외부 노출 필요 시
