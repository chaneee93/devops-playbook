# ══════════════════════════════════════════
# ExternalSecret — 이 비밀을 가져와서 K8s Secret으로
# Git에는 이 '참조'만! 실제 값은 AWS에!
# [CHANGE] remoteRef.key를 실제 시크릿 이름으로
# ══════════════════════════════════════════
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials                 # [CHANGE]
  namespace: student16                 # [CHANGE]
spec:
  refreshInterval: 1h                  # 갱신 주기
  secretStoreRef:
    name: aws-store                    # SecretStore 이름
    kind: SecretStore
  target:
    name: db-secret                    # 생성될 K8s Secret 이름
    creationPolicy: Owner
  data:
    - secretKey: username              # K8s Secret의 키
      remoteRef:
        key: /notes/dev/db-credentials # [CHANGE] AWS 시크릿 이름
        property: username             # JSON 필드
    - secretKey: password
      remoteRef:
        key: /notes/dev/db-credentials
        property: password
    - secretKey: host
      remoteRef:
        key: /notes/dev/db-credentials
        property: host
